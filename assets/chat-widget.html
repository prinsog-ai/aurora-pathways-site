<!-- Aurora AI Chat Widget -->
<style>
  #aurora-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #D4AF37, #B8860B);
    border: none;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 4px 20px rgba(212,175,55,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    font-size: 24px;
  }
  #aurora-chat-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 30px rgba(212,175,55,0.6);
  }
  #aurora-chat-panel {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 380px;
    max-height: 520px;
    background: #1a1a1a;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 16px;
    z-index: 9999;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  #aurora-chat-panel.open { display: flex; }
  #aurora-chat-header {
    background: linear-gradient(135deg, #D4AF37, #B8860B);
    color: #000;
    padding: 14px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #aurora-chat-close {
    background: none;
    border: none;
    color: #000;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  #aurora-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 280px;
    max-height: 360px;
  }
  .chat-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.85rem;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .chat-msg.bot {
    align-self: flex-start;
    background: #2a2a2a;
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #D4AF37, #B8860B);
    color: #000;
    border-bottom-right-radius: 4px;
  }
  #aurora-chat-input-area {
    display: flex;
    padding: 12px;
    border-top: 1px solid rgba(212,175,55,0.2);
    gap: 8px;
  }
  #aurora-chat-input {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    color: #e0e0e0;
    font-size: 0.85rem;
    outline: none;
    font-family: inherit;
  }
  #aurora-chat-input:focus {
    border-color: #D4AF37;
  }
  #aurora-chat-input::placeholder { color: #666; }
  #aurora-chat-send {
    background: linear-gradient(135deg, #D4AF37, #B8860B);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    color: #000;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: opacity 0.2s;
  }
  #aurora-chat-send:hover { opacity: 0.85; }
  .chat-typing {
    align-self: flex-start;
    color: #888;
    font-size: 0.8rem;
    font-style: italic;
  }
  .chat-msg a { color: #D4AF37; text-decoration: underline; }
  @media (max-width: 480px) {
    #aurora-chat-panel {
      right: 8px;
      left: 8px;
      width: auto;
      bottom: 80px;
      max-height: 70vh;
    }
    #aurora-chat-btn {
      bottom: 16px;
      right: 16px;
    }
  }
</style>

<button id="aurora-chat-btn" onclick="toggleChat()" aria-label="Chat with Aurora AI">💬</button>

<div id="aurora-chat-panel">
  <div id="aurora-chat-header">
    <span>✦ Aurora AI Assistant</span>
    <button id="aurora-chat-close" onclick="toggleChat()">✕</button>
  </div>
  <div id="aurora-chat-messages">
    <div class="chat-msg bot">Hi! I'm the Aurora AI assistant. I can answer questions about our protocols, pricing, and Web3 services. What would you like to know?</div>
  </div>
  <div id="aurora-chat-input-area">
    <input id="aurora-chat-input" type="text" placeholder="Ask about our protocols..." onkeydown="if(event.key==='Enter')sendChat()" autocomplete="off" />
    <button id="aurora-chat-send" onclick="sendChat()">Send</button>
  </div>
</div>

<script>
(function() {
  const PANEL = document.getElementById('aurora-chat-panel');
  const MSGS = document.getElementById('aurora-chat-messages');
  const INPUT = document.getElementById('aurora-chat-input');

  // Knowledge base for local responses
  const KB = {
    protocols: `We've shipped 4 DAO protocols on Polygon mainnet:\n\n📋 <b>TaskLync</b> — Freelance job marketplace with escrow\n💝 <b>Pledgly</b> — Creator subscription platform\n🔮 <b>Forekast</b> — Prediction markets\n🚗 <b>RideP2P</b> — Peer-to-peer ride-sharing\n\nAll tested with 590 automated tests. <a href="/portfolio/">See demos →</a>`,

    pricing: `Our Web3 consulting pricing:\n\n• <b>$5,000</b> setup (one-time)\n• <b>$500/mo</b> ongoing management\n\nWe build custom blockchain solutions for businesses. <a href="mailto:contact@aurorapathways.xyz">Contact us →</a>`,

    services: `Aurora Pathways provides:\n\n• Smart contract development (Solidity, Polygon)\n• dApp frontend & deployment\n• DAO governance design\n• Token economics & tokenization\n• Blockchain integration for existing businesses\n\nWe specialize in making Web3 accessible for traditional industries.`,

    technology: `Our tech stack:\n\n• <b>Blockchain:</b> Polygon (low gas, fast finality)\n• <b>Contracts:</b> Solidity + OpenZeppelin + Foundry\n• <b>Frontend:</b> Vanilla JS + ethers.js\n• <b>Testing:</b> 590 automated tests (Foundry)\n• <b>Upgradeability:</b> UUPS proxy pattern (V3)\n• <b>Governance:</b> Custom GovernorBase module`,

    contact: `Reach us at:\n\n📧 <a href="mailto:contact@aurorapathways.xyz">contact@aurorapathways.xyz</a>\n🌐 <a href="/">aurorapathways.xyz</a>\n\nOr use the contact form on our site!`,

    web3: `Web3 is the next evolution of the internet — decentralized, transparent, and user-owned. Instead of companies controlling your data, blockchain lets users own their assets and interactions directly.\n\nAt Aurora Pathways, we help businesses tap into Web3 without the complexity. We handle the blockchain, you get the benefits.`,

    polygon: `Polygon is a Layer 2 scaling solution for Ethereum. It offers:\n\n• <b>Low fees:</b> ~$0.01 per transaction\n• <b>Fast:</b> 2-second block times\n• <b>Secure:</b> Backed by Ethereum's security\n• <b>Eco-friendly:</b> Proof-of-Stake consensus\n\nThat's why we build all our protocols on Polygon — real utility without the gas pain.`,

    tests: `We maintain <b>590 automated tests</b> across our 4 protocols:\n\n• TaskLync: escrow, milestones, disputes, jury system\n• RideP2P: ride matching, payments, ratings\n• Pledgly: subscriptions, creator payouts\n• Forekast: prediction markets, resolution, payouts\n\nAll tests run on every deploy via Foundry. Quality is non-negotiable.`,

    dao: `DAO stands for Decentralized Autonomous Organization. It's a way to govern a protocol using token-based voting instead of a traditional board of directors.\n\nOur governance module lets each protocol have:\n• Proposal creation & voting\n• Timelock-protected execution\n• Configurable quorum & voting periods\n• Shared base code, independent instances`
  };

  // Match user questions to knowledge base
  function findAnswer(q) {
    q = q.toLowerCase();
    if (q.match(/protocol|dapp|app|tasklync|pledgly|forekast|ridep2p|ride|task|pledge|predict/)) return KB.protocols;
    if (q.match(/price|pricing|cost|how much|fee|rate|\$/)) return KB.pricing;
    if (q.match(/service|offer|build|develop|what do you do|help/)) return KB.services;
    if (q.match(/tech|stack|tool|foundry|solidity|openzeppelin|proxy|upgrade/)) return KB.technology;
    if (q.match(/contact|email|reach|talk|call|meeting/)) return KB.contact;
    if (q.match(/web3|web 3|blockchain|decentrali/)) return KB.web3;
    if (q.match(/polygon|matic|layer 2|l2|gas|chain/)) return KB.polygon;
    if (q.match(/test|quality|audit|security|safe/)) return KB.tests;
    if (q.match(/dao|govern|vote|voting|proposal|token/)) return KB.dao;
    if (q.match(/hello|hi |hey|greetings/)) return "Hey there! What would you like to know about Aurora Pathways? I can help with our protocols, pricing, technology, or services.";
    if (q.match(/thank|thanks/)) return "You're welcome! Let me know if you have any other questions.";
    return "Great question! Here's what I can help with:\n\n• <b>Protocols</b> — our 4 shipped DAOs\n• <b>Pricing</b> — consulting rates\n• <b>Services</b> — what we build\n• <b>Technology</b> — our tech stack\n• <b>Web3 basics</b> — what is blockchain\n• <b>Contact</b> — reach our team\n\nTry asking about any of these!";
  }

  function addMsg(text, isUser) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isUser ? 'user' : 'bot');
    div.innerHTML = text;
    MSGS.appendChild(div);
    MSGS.scrollTop = MSGS.scrollHeight;
  }

  window.sendChat = function() {
    const q = INPUT.value.trim();
    if (!q) return;
    addMsg(q, true);
    INPUT.value = '';

    // Show typing indicator
    const typing = document.createElement('div');
    typing.className = 'chat-typing';
    typing.textContent = 'Thinking...';
    MSGS.appendChild(typing);
    MSGS.scrollTop = MSGS.scrollHeight;

    setTimeout(() => {
      MSGS.removeChild(typing);
      addMsg(findAnswer(q), false);
    }, 400 + Math.random() * 400);
  };

  window.toggleChat = function() {
    PANEL.classList.toggle('open');
    if (PANEL.classList.contains('open')) {
      INPUT.focus();
    }
  };
})();
</script>
