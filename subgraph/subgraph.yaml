specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TaskEscrowV2
    network: matic
    source:
      address: "0x0cB5E017aA50Ed0e8c8F583E390e1e2aEeE6e466"
      abi: TaskEscrowV2
      startBlock: 65000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Job
        - Milestone
        - Application
        - Freelancer
        - Dispute
        - DisputeVote
        - PlatformStats
        - DailyStats
      abis:
        - name: TaskEscrowV2
          file: ./abis/TaskEscrowV2.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,uint256,string,string,uint256)
          handler: handleJobCreated
        - event: ApplicantAdded(indexed uint256,indexed address)
          handler: handleApplicantAdded
        - event: FreelancerAccepted(indexed uint256,indexed address)
          handler: handleFreelancerAccepted
        - event: MilestoneReleased(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handleMilestoneReleased
        - event: JobCompleted(indexed uint256,indexed address)
          handler: handleJobCompleted
        - event: JobCancelled(indexed uint256,indexed address)
          handler: handleJobCancelled
        - event: JobDisputed(indexed uint256,indexed address)
          handler: handleJobDisputed
        - event: DisputeVoteCast(indexed uint256,indexed address,bool)
          handler: handleDisputeVoteCast
        - event: DisputeResolved(indexed uint256,bool)
          handler: handleDisputeResolved
        - event: FreelancerRated(indexed uint256,indexed address,uint256)
          handler: handleFreelancerRated
        - event: DeadlineRefund(indexed uint256,indexed address,uint256)
          handler: handleDeadlineRefund
      file: ./src/tasklync.ts
