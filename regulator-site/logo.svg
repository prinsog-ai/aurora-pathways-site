<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2d5f8a"/>
    </linearGradient>
    <linearGradient id="text3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4a73"/>
      <stop offset="100%" style="stop-color:#0f2840"/>
    </linearGradient>
  </defs>

  <!-- Arrow / Circuit element -->
  <g transform="translate(5, 12)">
    <!-- Main arrow body -->
    <polygon points="0,38 50,10 50,24 80,24 80,52 50,52 50,66" fill="url(#arrow)"/>
    <!-- Circuit dots on arrow -->
    <circle cx="25" cy="38" r="3" fill="#4a8bc2" opacity="0.7"/>
    <circle cx="55" cy="38" r="2" fill="#4a8bc2" opacity="0.5"/>
    <line x1="55" y1="38" x2="65" y2="38" stroke="#4a8bc2" stroke-width="1" opacity="0.4"/>
    <circle cx="70" cy="30" r="1.5" fill="#4a8bc2" opacity="0.4"/>
    <circle cx="70" cy="46" r="1.5" fill="#4a8bc2" opacity="0.4"/>
    <line x1="65" y1="32" x2="70" y2="30" stroke="#4a8bc2" stroke-width="0.8" opacity="0.3"/>
    <line x1="65" y1="44" x2="70" y2="46" stroke="#4a8bc2" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- REGULATOR — bold, geometric, outlined -->
  <text x="100" y="52" font-family="Inter, 'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="url(#text3d)" letter-spacing="3">REGULATOR</text>
  <!-- 3D shadow offset -->
  <text x="102" y="54" font-family="Inter, 'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="#0a1e33" letter-spacing="3" opacity="0.3">REGULATOR</text>
  <!-- Outline effect -->
  <text x="100" y="52" font-family="Inter, 'Arial Black', Impact, sans-serif" font-size="42" font-weight="900" fill="none" stroke="#2d5f8a" stroke-width="0.5" letter-spacing="3">REGULATOR</text>

  <!-- LOGISTICS — lighter, smaller, underneath -->
  <text x="102" y="76" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#6b8faa" letter-spacing="12">LOGISTICS</text>

  <!-- Subtle divider line -->
  <line x1="100" y1="58" x2="490" y2="58" stroke="#2d5f8a" stroke-width="0.6" opacity="0.25"/>
</svg>
