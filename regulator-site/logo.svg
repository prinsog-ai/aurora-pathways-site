<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Shield / Badge shape -->
  <path d="M30 15 L55 8 L80 15 L80 55 C80 72 67 85 55 92 C43 85 30 72 30 55 Z" fill="none" stroke="url(#amber)" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Trailer silhouette inside shield -->
  <rect x="40" y="32" width="30" height="22" rx="2" fill="url(#amber)" opacity="0.85"/>
  <rect x="40" y="28" width="14" height="8" rx="1" fill="url(#amber)" opacity="0.7"/>
  <circle cx="44" cy="58" r="4" fill="none" stroke="url(#amber)" stroke-width="2"/>
  <circle cx="62" cy="58" r="4" fill="none" stroke="url(#amber)" stroke-width="2"/>
  <line x1="40" y1="38" x2="70" y2="38" stroke="#0c0c0e" stroke-width="1"/>
  <line x1="40" y1="44" x2="70" y2="44" stroke="#0c0c0e" stroke-width="1"/>
  
  <!-- R icon accent -->
  <text x="50" y="74" font-family="Inter, Arial Black, sans-serif" font-size="16" font-weight="900" fill="url(#amber)" text-anchor="middle" opacity="0.4">R</text>
  
  <!-- REGULATOR text -->
  <text x="100" y="55" font-family="Inter, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="2">REGULATOR</text>
  
  <!-- LOGISTICS text -->
  <text x="100" y="78" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#f59e0b" letter-spacing="6">LOGISTICS</text>
  
  <!-- Subtle divider line -->
  <line x1="100" y1="60" x2="350" y2="60" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
</svg>
