<!DOCTYPE html>
<html lang="en">

    <title>Page Not Found — Regulator Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e6ed;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .container{max-width:480px}
    .code{font-size:6rem;font-weight:900;background:linear-gradient(135deg,#4a6fa5,#7b9ec7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:16px}

    p{color:#8892a4;font-size:1rem;line-height:1.7;margin-bottom:32px}

    .btn-primary{background:linear-gradient(135deg,#4a6fa5,#3a5a8a);color:#fff;box-shadow:0 4px 20px rgba(74,111,165,.2)}
    .btn-primary:hover{box-shadow:0 8px 32px rgba(74,111,165,.25);transform:translateY(-2px)}
    .links{margin-top:24px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .links a{color:#7b9ec7;font-size:.85rem;font-weight:500;text-decoration:none;transition:.2s}
    .links a:hover{color:#4a6fa5}
    .arrow{margin-right:4px}
    </style>
</head>

</html>
