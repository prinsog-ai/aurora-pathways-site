<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --surface:#0f0f16;
  --surface2:#15151f;
  --text:#e8e8ed;
  --text2:#8a8a9a;
  --accent:#7c5cfc;
  --accent2:#4ec9b0;
  --accent3:#ff6b9d;
}
html{height:100%}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.6;
  overflow:hidden;
  position:relative;
}

/* Aurora gradient background */
.aurora-bg{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 20%,rgba(124,92,252,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 80% 70%,rgba(78,201,176,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 50% 40%,rgba(255,107,157,0.05) 0%,transparent 60%);
  animation: auroraShift 12s ease-in-out infinite alternate;
}
@keyframes auroraShift{
  0%{
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%,rgba(124,92,252,0.08) 0%,transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 70%,rgba(78,201,176,0.06) 0%,transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 40%,rgba(255,107,157,0.05) 0%,transparent 60%);
  }
  50%{
    background:
      radial-gradient(ellipse 55% 55% at 70% 30%,rgba(124,92,252,0.10) 0%,transparent 60%),
      radial-gradient(ellipse 60% 50% at 30% 60%,rgba(78,201,176,0.08) 0%,transparent 60%),
      radial-gradient(ellipse 50% 60% at 60% 80%,rgba(255,107,157,0.06) 0%,transparent 60%);
  }
  100%{
    background:
      radial-gradient(ellipse 50% 60% at 40% 70%,rgba(124,92,252,0.07) 0%,transparent 60%),
      radial-gradient(ellipse 60% 50% at 60% 20%,rgba(78,201,176,0.09) 0%,transparent 60%),
      radial-gradient(ellipse 55% 55% at 30% 50%,rgba(255,107,157,0.07) 0%,transparent 60%);
  }
}

.container{
  position:relative;
  z-index:1;
  text-align:center;
  padding:0 24px;
  max-width:600px;
}

.error-code{
  font-size:clamp(6rem,15vw,10rem);
  font-weight:900;
  letter-spacing:-0.04em;
  line-height:1;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 50%,var(--accent3) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:16px;
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:0.85}
}

.error-message{
  font-size:1.3rem;
  font-weight:600;
  color:var(--text);
  margin-bottom:8px;
}
.error-sub{
  font-size:0.95rem;
  color:var(--text2);
  margin-bottom:48px;
  max-width:400px;
  margin-left:auto;
  margin-right:auto;
}

.links-grid{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:40px;
}
.links-grid a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:12px 24px;
  background:var(--surface);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  color:var(--text);
  text-decoration:none;
  font-size:0.9rem;
  font-weight:500;
  transition:all 0.25s ease;
}
.links-grid a:hover{
  background:var(--surface2);
  border-color:var(--accent);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,92,252,0.15);
}
.links-grid a .emoji{font-size:1.1rem}

.home-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 32px;
  background:linear-gradient(135deg,var(--accent),#6a4cdc);
  color:#fff;
  border-radius:12px;
  text-decoration:none;
  font-size:1rem;
  font-weight:600;
  transition:all 0.25s ease;
}
.home-link:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(124,92,252,0.3);
}

.footer-note{
  margin-top:48px;
  font-size:0.78rem;
  color:var(--text2);
  opacity:0.6;
}
.footer-note a{color:var(--accent);text-decoration:none}
.footer-note a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="aurora-bg"></div>

<div class="container">
  <div class="error-code">404</div>
  <div class="error-message">Page not found</div>
  <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>

  <div class="links-grid">
    <a href="https://tasklync.xyz"><span class="emoji">📋</span> Tasklync</a>
    <a href="https://pledgly.xyz"><span class="emoji">💝</span> Pledgly</a>
    <a href="https://forekastdao.xyz"><span class="emoji">🔮</span> Forekast</a>
    <a href="https://ridep2p.xyz"><span class="emoji">🚗</span> RideP2P</a>
  </div>

  <a href="https://aurorapathways.xyz" class="home-link">🌌 Back to Aurora Pathways</a>

  <p class="footer-note"><a href="https://aurorapathways.xyz">aurorapathways.xyz</a> — Web3 that works.</p>
</div>

</body>
</html>
