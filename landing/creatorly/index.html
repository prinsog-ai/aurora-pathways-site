<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#111118;--text:#e8e8ed;--text2:#9898a8;--accent:#7c5cfc;--accent2:#4ec9b0;--gradient:linear-gradient(135deg,#7c5cfc 0%,#4ec9b0 50%,#3b82f6 100%);--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
.container{max-width:600px;padding:40px 24px}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;margin-bottom:24px;background:rgba(124,92,252,0.15);color:var(--accent)}
h1{font-size:3rem;font-weight:800;margin-bottom:12px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--text2);font-size:1.2rem;margin-bottom:32px;line-height:1.6}
.features{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.feature{background:var(--surface);border:1px solid var(--glass-border);border-radius:12px;padding:20px;width:140px}
.feature .icon{font-size:1.5rem;margin-bottom:8px}
.feature .stat{font-size:1.3rem;font-weight:700;color:var(--accent2)}
.feature .label{font-size:0.8rem;color:var(--text2)}
.btn{display:inline-block;padding:14px 32px;border-radius:10px;font-weight:600;font-size:1rem;text-decoration:none;transition:all 0.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#9370ff}
.btn-outline{background:transparent;border:1px solid var(--glass-border);color:var(--text);margin-left:12px}
.links{color:var(--text2);font-size:0.85rem;margin-top:24px}
.links a{color:var(--accent2);text-decoration:none}
</style>
