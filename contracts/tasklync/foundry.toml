[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
optimizer_details = { yul = true, yulDetails = { stackAllocation = true, optimizerSteps = "u" } }

[rpc_endpoints]
polygon_amoy = "https://rpc-amoy.polygon.technology"
base_sepolia = "https://sepolia.base.org"
