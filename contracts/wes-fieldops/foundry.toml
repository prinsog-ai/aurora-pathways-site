[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
optimizer_details = { yul = true, yulDetails = { stackAllocation = true, optimizerSteps = "u" } }

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
polygon = "https://polygon-rpc.com"
polygon_mainnet = "${POLYGON_RPC_URL}"
