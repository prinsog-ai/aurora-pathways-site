<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasklync dApp</title>
<meta name="description" content="Tasklync dApp: connect your wallet to post jobs, stake and earn on the permissionless freelance marketplace.">
<link rel="canonical" href="https://aurorapathways.xyz/dapps/tasklync/">
<meta property="og:title" content="Tasklync dApp">
<meta property="og:description" content="Tasklync dApp: connect your wallet to post jobs, stake and earn on the permissionless freelance marketplace.">
<meta property="og:url" content="https://aurorapathways.xyz/dapps/tasklync/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aurora Pathways">
<meta property="og:image" content="https://aurorapathways.xyz/og-image.png">
<meta name="twitter:image" content="https://aurorapathways.xyz/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tasklync dApp">
<meta name="twitter:description" content="Tasklync dApp: connect your wallet to post jobs, stake and earn on the permissionless freelance marketplace.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#0f0f16;--surface2:#15151f;--text:#e8e8ed;--text2:#8a8a9a;--accent:#7c5cfc;--accent2:#4ec9b0;--accent3:#ff6b9d;--gradient:linear-gradient(135deg,#7c5cfc 0%,#4ec9b0 50%,#3b82f6 100%);--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06);--radius:16px}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--glass-border);margin-bottom:32px}
.logo{font-size:1.3rem;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:10px 22px;border-radius:100px;font-weight:600;font-size:0.9rem;cursor:pointer;border:none;font-family:inherit;transition:all 0.2s;display:inline-block}
.btn-primary{background:var(--gradient);color:#fff}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(124,92,252,0.3)}
.btn-secondary{background:var(--glass);border:1px solid var(--glass-border);color:var(--text)}.btn-secondary:hover{background:rgba(255,255,255,0.06)}
.btn-sm{padding:8px 18px;font-size:0.82rem}
.btn-danger{background:rgba(255,107,157,0.15);color:var(--accent3);border:1px solid rgba(255,107,157,0.2)}
.wallet-info{display:flex;align-items:center;gap:12px}
.wallet-addr{font-size:0.85rem;color:var(--text2);background:var(--surface);padding:6px 14px;border-radius:8px;font-family:monospace}
.tabs{display:flex;gap:16px;margin-bottom:32px}
.tab{padding:10px 20px;border-radius:100px;font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.2s;background:var(--glass);border:1px solid var(--glass-border);color:var(--text2)}
.tab.active{background:rgba(124,92,252,0.15);border-color:var(--accent);color:var(--accent)}
.form-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:28px;margin-bottom:24px}
.form-card h3{font-size:1.1rem;margin-bottom:18px}
.form-row{margin-bottom:16px}
.form-row label{display:block;margin-bottom:6px;color:var(--text2);font-size:0.85rem;font-weight:500}
.form-row input,.form-row textarea{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:inherit;font-size:0.95rem}
.form-row textarea{resize:vertical;min-height:80px}
.job-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;margin-bottom:16px;transition:border-color 0.2s}
.job-card:hover{border-color:rgba(124,92,252,0.25)}
.job-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.job-title{font-size:1.1rem;font-weight:600}
.job-amount{color:var(--accent2);font-weight:700;font-size:1.05rem}
.job-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:0.8rem;color:var(--text2);margin-bottom:12px}
.job-meta span{background:var(--glass);padding:4px 10px;border-radius:6px}
.job-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:4px 12px;border-radius:10px;font-size:0.78rem;font-weight:600}
.badge-open{background:rgba(78,201,176,0.15);color:var(--accent2)}
.badge-inprogress{background:rgba(59,130,246,0.15);color:#3b82f6}
.badge-completed{background:rgba(124,92,252,0.15);color:var(--accent)}
.badge-cancelled{background:rgba(255,107,157,0.15);color:var(--accent3)}
.badge-disputed{background:rgba(255,180,60,0.15);color:#ffb43c}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:3rem;margin-bottom:16px}
.loading{text-align:center;padding:40px;color:var(--text2)}
.status-msg{padding:12px 18px;border-radius:10px;margin-bottom:16px;font-size:0.9rem}
.status-success{background:rgba(78,201,176,0.1);border:1px solid rgba(78,201,176,0.2);color:var(--accent2)}
.status-error{background:rgba(255,107,157,0.1);border:1px solid rgba(255,107,157,0.2);color:var(--accent3)}
@media(max-width:640px){header{flex-direction:column;gap:12px} .job-header{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">Tasklync dApp</div>
<div class="wallet-info" id="walletInfo">
<button class="btn btn-primary" onclick="connectWallet()" id="connectBtn">Connect Wallet</button>
</div>
</header>
<div id="statusBar"></div>
<div class="tabs" id="tabs" style="display:none">
<button class="tab active" onclick="switchTab('board')">Job Board</button>
<button class="tab" onclick="switchTab('post')">Post Job</button>
<button class="tab" onclick="switchTab('myjobs')">My Jobs</button>
</div>
<div id="content"><div class="empty"><div class="empty-icon">&#x1F50C;</div><p>Connect your wallet to get started</p></div></div>
</div>
<script>
const CONTRACT_ADDRESS = 'DEPLOYED_ADDRESS';
const USDC_ADDRESS = '0x036CbD53842c5426634e7929541eC2318f3dCF7e';
const CONTRACT_ABI = [{"type": "constructor", "inputs": [{"name": "_treasury", "type": "address", "internalType": "address"}], "stateMutability": "nonpayable"}, {"type": "function", "name": "MAX_FEE", "inputs": [], "outputs": [{"name": "", "type": "uint256", "internalType": "uint256"}], "stateMutability": "view"}, {"type": "function", "name": "acceptFreelancer", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}, {"name": "_freelancer", "type": "address", "internalType": "address"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "applyToJob", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "cancelJob", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "completeJob", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "createJob", "inputs": [{"name": "_token", "type": "address", "internalType": "contract IERC20"}, {"name": "_amount", "type": "uint256", "internalType": "uint256"}, {"name": "_description", "type": "string", "internalType": "string"}], "outputs": [{"name": "", "type": "uint256", "internalType": "uint256"}], "stateMutability": "nonpayable"}, {"type": "function", "name": "disputeJob", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "getApplicants", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}], "outputs": [{"name": "", "type": "address[]", "internalType": "address[]"}], "stateMutability": "view"}, {"type": "function", "name": "jobCount", "inputs": [], "outputs": [{"name": "", "type": "uint256", "internalType": "uint256"}], "stateMutability": "view"}, {"type": "function", "name": "jobs", "inputs": [{"name": "", "type": "uint256", "internalType": "uint256"}], "outputs": [{"name": "client", "type": "address", "internalType": "address"}, {"name": "freelancer", "type": "address", "internalType": "address"}, {"name": "token", "type": "address", "internalType": "contract IERC20"}, {"name": "amount", "type": "uint256", "internalType": "uint256"}, {"name": "description", "type": "string", "internalType": "string"}, {"name": "status", "type": "uint8", "internalType": "enum TaskEscrow.Status"}, {"name": "createdAt", "type": "uint256", "internalType": "uint256"}], "stateMutability": "view"}, {"type": "function", "name": "owner", "inputs": [], "outputs": [{"name": "", "type": "address", "internalType": "address"}], "stateMutability": "view"}, {"type": "function", "name": "platformFee", "inputs": [], "outputs": [{"name": "", "type": "uint256", "internalType": "uint256"}], "stateMutability": "view"}, {"type": "function", "name": "platformTreasury", "inputs": [], "outputs": [{"name": "", "type": "address", "internalType": "address"}], "stateMutability": "view"}, {"type": "function", "name": "renounceOwnership", "inputs": [], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "resolveDispute", "inputs": [{"name": "_jobId", "type": "uint256", "internalType": "uint256"}, {"name": "payFreelancer", "type": "bool", "internalType": "bool"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "setPlatformFee", "inputs": [{"name": "_fee", "type": "uint256", "internalType": "uint256"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "setPlatformTreasury", "inputs": [{"name": "_treasury", "type": "address", "internalType": "address"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "function", "name": "transferOwnership", "inputs": [{"name": "newOwner", "type": "address", "internalType": "address"}], "outputs": [], "stateMutability": "nonpayable"}, {"type": "event", "name": "FreelancerAccepted", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "freelancer", "type": "address", "indexed": true, "internalType": "address"}], "anonymous": false}, {"type": "event", "name": "JobApplied", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "freelancer", "type": "address", "indexed": true, "internalType": "address"}], "anonymous": false}, {"type": "event", "name": "JobCancelled", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "client", "type": "address", "indexed": true, "internalType": "address"}], "anonymous": false}, {"type": "event", "name": "JobCompleted", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "freelancer", "type": "address", "indexed": true, "internalType": "address"}, {"name": "amount", "type": "uint256", "indexed": false, "internalType": "uint256"}, {"name": "fee", "type": "uint256", "indexed": false, "internalType": "uint256"}], "anonymous": false}, {"type": "event", "name": "JobCreated", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "client", "type": "address", "indexed": true, "internalType": "address"}, {"name": "amount", "type": "uint256", "indexed": false, "internalType": "uint256"}, {"name": "description", "type": "string", "indexed": false, "internalType": "string"}], "anonymous": false}, {"type": "event", "name": "JobDisputed", "inputs": [{"name": "jobId", "type": "uint256", "indexed": true, "internalType": "uint256"}, {"name": "disputer", "type": "address", "indexed": true, "internalType": "address"}], "anonymous": false}, {"type": "event", "name": "OwnershipTransferred", "inputs": [{"name": "previousOwner", "type": "address", "indexed": true, "internalType": "address"}, {"name": "newOwner", "type": "address", "indexed": true, "internalType": "address"}], "anonymous": false}, {"type": "event", "name": "PlatformFeeUpdated", "inputs": [{"name": "newFee", "type": "uint256", "indexed": false, "internalType": "uint256"}], "anonymous": false}, {"type": "error", "name": "AlreadyApplied", "inputs": []}, {"type": "error", "name": "InvalidStatus", "inputs": [{"name": "current", "type": "uint8", "internalType": "enum TaskEscrow.Status"}]}, {"type": "error", "name": "NoFreelancerAccepted", "inputs": []}, {"type": "error", "name": "NotClient", "inputs": []}, {"type": "error", "name": "NotClientOrFreelancer", "inputs": []}, {"type": "error", "name": "NotFreelancer", "inputs": []}, {"type": "error", "name": "OwnableInvalidOwner", "inputs": [{"name": "owner", "type": "address", "internalType": "address"}]}, {"type": "error", "name": "OwnableUnauthorizedAccount", "inputs": [{"name": "account", "type": "address", "internalType": "address"}]}, {"type": "error", "name": "ReentrancyGuardReentrantCall", "inputs": []}, {"type": "error", "name": "SafeERC20FailedOperation", "inputs": [{"name": "token", "type": "address", "internalType": "address"}]}, {"type": "error", "name": "TransferFailed", "inputs": []}];
let provider, signer, contract, usdc, account;
function statusNames() { return {0:'Open',1:'InProgress',2:'Completed',3:'Cancelled',4:'Disputed'}; }
async function connectWallet() {
  try {
    if(!window.ethereum) return showStatus('Install MetaMask','error');
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts',[]);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    contract = new ethers.Contract(CONTRACT_ADDRESS,CONTRACT_ABI,signer);
    usdc = new ethers.Contract(USDC_ADDRESS,['function approve(address,uint256)','function allowance(address,address) view returns(uint256)','function balanceOf(address) view returns(uint256)'],signer);
    document.getElementById('walletInfo').innerHTML='<span class="wallet-addr">'+account.slice(0,6)+'...'+account.slice(-4)+'</span> <button class="btn btn-sm btn-secondary" onclick="disconnect()">Disconnect</button>';
    document.getElementById('tabs').style.display='flex';
    loadJobs();
  } catch(e) { showStatus('Connection failed: '+e.message,'error'); }
}
function disconnect() {
  provider=null;signer=null;contract=null;account=null;
  document.getElementById('walletInfo').innerHTML='<button class="btn btn-primary" onclick="connectWallet()">Connect Wallet</button>';
  document.getElementById('tabs').style.display='none';
  document.getElementById('content').innerHTML='<div class="empty"><div class="empty-icon">&#x1F50C;</div><p>Connect your wallet to get started</p></div>';
}
function showStatus(msg,type) {
  document.getElementById('statusBar').innerHTML='<div class="status-msg status-'+type+'">'+msg+'</div>';
  setTimeout(function(){ document.getElementById('statusBar').innerHTML=''; },5000);
}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  event.target.classList.add('active');
  if(tab==='board') loadJobs(); else if(tab==='myjobs') loadMyJobs(); else showPostForm();
}
function showPostForm() {
  document.getElementById('content').innerHTML='<div class="form-card"><h3>Post a New Job</h3><div class="form-row"><label>Description</label><textarea id="jobDesc" placeholder="e.g. Build a React landing page with wallet connect"></textarea></div><div class="form-row"><label>Amount (USDC)</label><input id="jobAmount" type="number" placeholder="100" step="0.01" min="1"></div><button class="btn btn-primary" onclick="postJob()">Post Job (3% fee)</button></div>';
}
async function postJob() {
  var desc=document.getElementById('jobDesc').value.trim();
  var amount=document.getElementById('jobAmount').value;
  if(!desc||!amount) return showStatus('Fill all fields','error');
  try {
    var amtWei=ethers.parseUnits(amount,6);
    var allowance=await usdc.allowance(account,CONTRACT_ADDRESS);
    if(allowance<amtWei){ showStatus('Approving USDC...','success'); var tx=await usdc.approve(CONTRACT_ADDRESS,amtWei*10n); await tx.wait(); }
    showStatus('Creating job...','success');
    var tx=await contract.createJob(USDC_ADDRESS,amtWei,desc);
    await tx.wait();
    showStatus('Job posted!','success');
    switchTab('board');
  } catch(e) { showStatus('Error: '+e.message,'error'); }
}
async function loadJobs() {
  var el=document.getElementById('content');
  el.innerHTML='<div class="loading">Loading jobs...</div>';
  try {
    var count=Number(await contract.jobCount());
    if(count===0){ el.innerHTML='<div class="empty"><div class="empty-icon">&#x1F4CB;</div><p>No jobs yet. Be the first!</p></div>'; return; }
    var sn=statusNames();
    var html='';
    for(var i=count-1;i>=0;i--) {
      var j=await contract.jobs(i);
      var s=sn[Number(j[6])];
      html+='<div class="job-card"><div class="job-header"><div class="job-title">#'+i+': '+esc(j[5])+'</div><div class="job-amount">'+ethers.formatUnits(j[4],6)+' USDC</div></div>';
      html+='<div class="job-meta"><span>Client: '+j[0].slice(0,6)+'...'+j[0].slice(-4)+'</span><span class="badge badge-'+s.toLowerCase()+'">'+s+'</span>';
      if(j[1]!=='0x0000000000000000000000000000000000000000') html+='<span>Freelancer: '+j[1].slice(0,6)+'...'+j[1].slice(-4)+'</span>';
      html+='</div><div class="job-actions">';
      if(s==='Open'&&j[0].toLowerCase()!==account.toLowerCase()) html+='<button class="btn btn-sm btn-primary" onclick="applyToJob('+i+')">Apply</button>';
      if(s==='Open'&&j[0].toLowerCase()===account.toLowerCase()) html+='<button class="btn btn-sm btn-secondary" onclick="showApplicants('+i+')">Applicants</button> <button class="btn btn-sm btn-danger" onclick="cancelJob('+i+')">Cancel</button>';
      if(s==='InProgress'&&j[0].toLowerCase()===account.toLowerCase()) html+='<button class="btn btn-sm btn-primary" onclick="completeJob('+i+')">Complete ' + String.fromCharCode(38) + ' Pay</button> <button class="btn btn-sm btn-danger" onclick="disputeJob('+i+')">Dispute</button>';
      if(s==='InProgress'&&j[1].toLowerCase()===account.toLowerCase()) html+='<button class="btn btn-sm btn-danger" onclick="disputeJob('+i+')">Dispute</button>';
      if(s==='Disputed') html+='<span style="color:var(--text2);font-size:0.85rem">Awaiting resolution</span>';
      html+='</div></div>';
    }
    el.innerHTML=html;
  } catch(e) { el.innerHTML='<div class="empty"><p>Error: '+e.message+'</p></div>'; }
}
function esc(s) { var d=document.createElement('div');d.textContent=s;return d.innerHTML; }
async function loadMyJobs() {
  var el=document.getElementById('content');el.innerHTML='<div class="loading">Loading...</div>';
  try {
    var count=Number(await contract.jobCount()),sn=statusNames(),html='<h3 style="margin-bottom:16px">My Jobs</h3>',found=0;
    for(var i=count-1;i>=0;i--) {
      var j=await contract.jobs(i);
      if(j[0].toLowerCase()===account.toLowerCase()||j[1].toLowerCase()===account.toLowerCase()) {
        found++;var s=sn[Number(j[6])];var role=j[0].toLowerCase()===account.toLowerCase()?'Posted':'Working on';
        html+='<div class="job-card"><div class="job-header"><div>'+role+'</div><div class="job-amount">'+ethers.formatUnits(j[4],6)+' USDC</div></div><p style="color:var(--text2);font-size:0.9rem;margin-bottom:8px">'+esc(j[5])+'</p><span class="badge badge-'+s.toLowerCase()+'">'+s+'</span></div>';
      }
    }
    if(!found) html+='<div class="empty"><div class="empty-icon">&#x1F464;</div><p>No jobs yet</p></div>';
    el.innerHTML=html;
  } catch(e) { el.innerHTML='<div class="empty"><p>Error: '+e.message+'</p></div>'; }
}
async function applyToJob(id) { try { var tx=await contract.applyToJob(id);showStatus('Applying...','success');await tx.wait();showStatus('Applied!','success');loadJobs(); } catch(e) { showStatus(e.message,'error'); } }
async function cancelJob(id) { try { var tx=await contract.cancelJob(id);showStatus('Cancelling...','success');await tx.wait();showStatus('Cancelled. USDC refunded.','success');loadJobs(); } catch(e) { showStatus(e.message,'error'); } }
async function completeJob(id) { try { var tx=await contract.completeJob(id);showStatus('Paying...','success');await tx.wait();showStatus('Paid! 3% fee deducted.','success');loadJobs(); } catch(e) { showStatus(e.message,'error'); } }
async function disputeJob(id) { try { var tx=await contract.disputeJob(id);showStatus('Disputing...','success');await tx.wait();showStatus('Disputed. Awaiting resolution.','success');loadJobs(); } catch(e) { showStatus(e.message,'error'); } }
async function showApplicants(id) { try { var apps=await contract.getApplicants(id);if(apps.length===0) return showStatus('No applicants','error');var list='';for(var i=0;i<apps.length;i++) list+=apps[i]+'
';showStatus('Applicants:
'+list,'success'); } catch(e) { showStatus(e.message,'error'); } }
</script>
</body>
</html>
